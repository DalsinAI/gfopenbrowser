name: pack build scripts

# The package build's scripts (scripts/build-pack.sh, fetch-deps.sh,
# fetch-tarballs.sh) and their pin files, tested on the host with local
# repositories and files only: no network, no stove.
on:
  push:
    paths:
      - 'scripts/build-pack.sh'
      - 'scripts/fetch-deps.sh'
      - 'scripts/fetch-tarballs.sh'
      - 'scripts/deps.lock'
      - 'scripts/tarballs.lock'
      - 'scripts/fonts.sha256'
      - 'webkit/UPSTREAM'
      - 'tests/pack/**'
      - 'scripts/jsimage.py'
      - 'tests/jsimage/**'
      - 'src/unicodelib/calls.txt'
      - 'src/unicodelib/versions.txt'
      - 'src/unicodelib/unicode_lib.c'
      - 'src/unicodelib/ul_client.h'
      - 'dist/Install-GFOpenBrowser'
      - 'dist/GFOpenBrowser/Install'
      - 'tests/unicodelib/**'
      - 'openbrowser.readme'
      - 'src/webcore/ob_launcher.c'
      - 'src/webcore/ob_browser.c'
      - 'tests/release/**'
      - '.github/workflows/pack.yml'
  pull_request:
    paths:
      - 'scripts/build-pack.sh'
      - 'scripts/fetch-deps.sh'
      - 'scripts/fetch-tarballs.sh'
      - 'scripts/deps.lock'
      - 'scripts/tarballs.lock'
      - 'scripts/fonts.sha256'
      - 'webkit/UPSTREAM'
      - 'tests/pack/**'
      - 'scripts/jsimage.py'
      - 'tests/jsimage/**'
      - 'src/unicodelib/calls.txt'
      - 'src/unicodelib/versions.txt'
      - 'src/unicodelib/unicode_lib.c'
      - 'src/unicodelib/ul_client.h'
      - 'dist/Install-GFOpenBrowser'
      - 'dist/GFOpenBrowser/Install'
      - 'tests/unicodelib/**'
      - 'openbrowser.readme'
      - 'src/webcore/ob_launcher.c'
      - 'src/webcore/ob_browser.c'
      - 'tests/release/**'
      - '.github/workflows/pack.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch-deps
        run: sh tests/pack/test_fetch_deps.sh
      - name: build-pack and fetch-tarballs
        run: sh tests/pack/test_build_pack.sh
      - name: jsimage demangle
        run: python3 tests/jsimage/test_demangle.py
      - name: unicode.library version and installers
        run: python3 tests/unicodelib/test_versions.py
      - name: release version strings agree
        run: python3 tests/release/test_rc_version.py
