# GFOpenBrowser's upstream tarballs, pinned. scripts/fetch-tarballs.sh puts
# each one in the tarballs folder and checks its sha256; the deps' own build
# scripts (deps.lock) unpack them. One file a line: FILE SHA256 URL, then
# what it is. URL - means there is no public URL to take it from: put the
# file in TARBALLS_FROM yourself (the sha256 is checked all the same).
# The sha256s are the ones each dep's SOURCES and build.sh pin.
