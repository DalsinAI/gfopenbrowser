# GFOpenBrowser's build inputs, pinned. scripts/fetch-deps.sh checks each one
# out at its commit; scripts/build-pack.sh builds the package from them.
# One input a line: NAME URL COMMIT [sparse=PATH,PATH...], then what the build
# takes from it. sparse= checks out only those paths (git sparse-checkout, cone).
# Lines starting with # and empty lines are skipped. A COMMIT is a full
# 40-hex sha. Change a pin in a PR of its own, with the lab result.
# Pinned 14 Nov 2026 to each repository's main as it stood (0.9.0 RC1 era).
# MIT, Copyright (c) 2026 AmiCradle Team.

